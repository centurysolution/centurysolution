name: Build HusainERP APK
on:
  push:
    branches: [ husainerp-apk-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild Android source
        run: |
          mkdir -p build-src
          base64 -d husainerp-build/source.b64 > source.zip
          unzip -q source.zip -d build-src
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-src/app/src/main/java/com/husain/erp/LocalErpServer.java')
          s=p.read_text()
          old='private static Response json(int code, Object value){ Response.Status s=Response.Status.lookup(code); if(s==null)s=Response.Status.OK; Response r=newFixedLengthResponse(s,"application/json; charset=utf-8",String.valueOf(value)); cors(r); return r; }'
          new='private static Response.Status statusFor(int code){ switch(code){ case 201:return Response.Status.CREATED; case 204:return Response.Status.NO_CONTENT; case 400:return Response.Status.BAD_REQUEST; case 401:return Response.Status.UNAUTHORIZED; case 403:return Response.Status.FORBIDDEN; case 404:return Response.Status.NOT_FOUND; case 405:return Response.Status.METHOD_NOT_ALLOWED; case 500:return Response.Status.INTERNAL_ERROR; default:return Response.Status.OK; } }\n    private static Response json(int code, Object value){ Response r=newFixedLengthResponse(statusFor(code),"application/json; charset=utf-8",String.valueOf(value)); cors(r); return r; }'
          if old not in s: raise SystemExit('Expected NanoHTTPD status line not found')
          p.write_text(s.replace(old,new))
          PY
          mkdir -p build-src/app/src/main/assets placeholder
          printf '<!doctype html><meta charset="utf-8"><title>HusainERP</title><h1>Preparing HusainERP</h1>' > placeholder/index.html
          (cd placeholder && zip -q ../build-src/app/src/main/assets/erp_bundle.zip index.html)
      - name: Build installable APK
        run: gradle -p build-src --no-daemon assembleDebug
      - name: Prepare artifact
        run: cp build-src/app/build/outputs/apk/debug/app-debug.apk HusainERP-base.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HusainERP-Base-APK
          path: HusainERP-base.apk
          if-no-files-found: error
