name: Build HusainERP APK
on:
  push:
    branches: [ husainerp-apk-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild Android source
        run: |
          mkdir -p build-src placeholder
          base64 -d husainerp-build/source.b64 > source.zip
          unzip -q source.zip -d build-src
          mkdir -p build-src/app/src/main/assets
          printf '<!doctype html><meta charset="utf-8"><title>HusainERP</title><h1>Preparing HusainERP</h1>' > placeholder/index.html
          (cd placeholder && zip -q ../build-src/app/src/main/assets/erp_bundle.zip index.html)
      - name: Build installable APK
        run: gradle -p build-src --no-daemon assembleDebug
      - name: Prepare artifact
        run: cp build-src/app/build/outputs/apk/debug/app-debug.apk HusainERP-base.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HusainERP-Base-APK
          path: HusainERP-base.apk
          if-no-files-found: error
