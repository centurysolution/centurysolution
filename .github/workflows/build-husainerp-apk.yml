name: Build HusainERP APK
on:
  push:
    branches: [ husainerp-apk-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android source
        run: |
          rm -rf build-src
          mkdir -p build-src
          base64 -d husainerp-build/source-small.b64 > source.zip
          unzip -t source.zip
          unzip -q source.zip -d build-src
          sed -i 's/minSdk 26/minSdk 23/' build-src/app/build.gradle
          sed -i 's/versionCode 1/versionCode 2/' build-src/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.0.1'/" build-src/app/build.gradle
          mkdir -p build-src/app/src/main/assets
          rm -f build-src/app/src/main/assets/erp_bundle.zip
          cd CENTURY_SOLUTION_v13
          zip -qr ../build-src/app/src/main/assets/erp_bundle.zip .
          cd ..
          test -s build-src/app/src/main/assets/erp_bundle.zip
          unzip -t build-src/app/src/main/assets/erp_bundle.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        run: gradle -p build-src --no-daemon assembleDebug
      - name: Verify APK
        run: |
          cp build-src/app/build/outputs/apk/debug/app-debug.apk HusainERP.apk
          unzip -t HusainERP.apk
          test -s HusainERP.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose HusainERP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HusainERP-Installable
          path: HusainERP.apk
          if-no-files-found: error
